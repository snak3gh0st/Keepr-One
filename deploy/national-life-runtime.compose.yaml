# Import this file as a separate Coolify Docker Compose service. It is not part
# of the public Keepr One web application deployment.
#
# Before deployment, point national-life-viewer.keeprone.com at this Coolify
# host and configure all ${...} values in Coolify's service environment. Do not
# publish Steel's ports or add Traefik/Caddy labels to national-life-steel.
services:
  national-life-steel:
    # Pinned on 2026-07-29. Replace only with a reviewed immutable digest.
    build:
      context: ..
      dockerfile: Dockerfile.national-life-steel
    image: keeprone-national-life-steel:privacy-hardened
    restart: unless-stopped
    expose:
      - "3000"
      - "9223"
    # Steel's API entrypoint does not start a display server. The viewer is
    # intentionally headful, so provide its private X server and D-Bus inside
    # disposable mounts before starting the API.
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - >-
        set -eu;
        mkdir -p /run/dbus;
        dbus-daemon --system --fork;
        Xvfb :10 -screen 0 1600x1000x24 -ac +extension RANDR >/tmp/xvfb.log 2>&1 &
        awk '/^http \{/ { print; print "    access_log off;"; print "    error_log /dev/stderr warn;"; next } { sub(/proxy_set_header Host \$$host;/, "proxy_set_header Host 127.0.0.1;"); print }' /app/api/nginx.conf >/tmp/nginx.conf;
        nginx -c /tmp/nginx.conf;
        exec /app/api/entrypoint.sh --no-nginx
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DOMAIN: national-life-steel:3000
      USE_SSL: "false"
      CDP_DOMAIN: national-life-steel:9223
      CDP_REDIRECT_PORT: "9223"
      CHROME_HEADLESS: "false"
      DEFAULT_TIMEZONE: America/New_York
      LOG_LEVEL: warn
      LOG_STORAGE_ENABLED: "false"
      ENABLE_CDP_LOGGING: "false"
      LOG_CUSTOM_EMIT_EVENTS: "false"
      ENABLE_VERBOSE_LOGGING: "false"
    # Steel's API is PID 1 here and never reaps orphaned Chrome grandchildren, so
    # every released session left zombies behind: 78 of them had accumulated when
    # the container wedged at 253/256 PIDs and failed every launch with a 60s
    # timeout. `init` puts a real reaper at PID 1, which is the actual fix; the
    # raised ceiling is only headroom.
    init: true
    mem_limit: 2g
    pids_limit: 1024
    shm_size: 1g
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g
      - /run:rw,noexec,nosuid,size=64m
      - /var/lib/nginx:rw,noexec,nosuid,size=64m
      - /data/logs:rw,noexec,nosuid,size=128m
      - /files:rw,noexec,nosuid,size=128m
      - /app/.cache:rw,noexec,nosuid,size=256m
      - /root/.config:rw,noexec,nosuid,size=256m
      - /root/.cache:rw,noexec,nosuid,size=256m
    networks:
      national-life-private:
        aliases:
          - national-life-steel

  national-life-runtime:
    build:
      context: ..
      dockerfile: Dockerfile.national-life-runtime
    restart: unless-stopped
    depends_on:
      - national-life-steel
    expose:
      - "3010"
    environment:
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
      BETTER_AUTH_URL: "${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}"
      STEEL_BASE_URL: http://national-life-steel:3000
      NATIONAL_LIFE_PORTAL_ORIGINS: https://www.nationallife.com,https://nlg-prod.auth0.com
      NATIONAL_LIFE_PORTAL_LOGIN_URL: https://www.nationallife.com/agent/auth/login?returnUrl=%2Fagent%2F
      NATIONAL_LIFE_SESSION_SCOPE_ID: "${NATIONAL_LIFE_SESSION_SCOPE_ID:?NATIONAL_LIFE_SESSION_SCOPE_ID is required}"
      NATIONAL_LIFE_SESSION_KEY_VERSION: "${NATIONAL_LIFE_SESSION_KEY_VERSION:?NATIONAL_LIFE_SESSION_KEY_VERSION is required}"
      NATIONAL_LIFE_SESSION_KEYS: "${NATIONAL_LIFE_SESSION_KEYS:?NATIONAL_LIFE_SESSION_KEYS is required}"
      NATIONAL_LIFE_VIEWER_SIGNING_KEY: "${NATIONAL_LIFE_VIEWER_SIGNING_KEY:?NATIONAL_LIFE_VIEWER_SIGNING_KEY is required}"
      NATIONAL_LIFE_VIEWER_PUBLIC_ORIGIN: https://national-life-viewer.keeprone.com
      NATIONAL_LIFE_VIEWER_APP_ORIGINS: "${NATIONAL_LIFE_VIEWER_APP_ORIGINS:-https://keeprone.com,https://www.keeprone.com,https://app.keeprone.com}"
      NATIONAL_LIFE_VIEWER_BIND_HOST: 0.0.0.0
      NATIONAL_LIFE_VIEWER_PORT: "3010"
      NATIONAL_LIFE_RUNTIME_WORKER_ID: "${NATIONAL_LIFE_RUNTIME_WORKER_ID:?NATIONAL_LIFE_RUNTIME_WORKER_ID is required}"
      # The secure default remains disabled. A production rollout must opt in
      # with `true` and one or more exact agent IDs; the runtime rejects an
      # enabled empty or wildcard allowlist.
      NATIONAL_LIFE_INTERACTIVE_LOGIN_ENABLED: "${NATIONAL_LIFE_INTERACTIVE_LOGIN_ENABLED:-false}"
      NATIONAL_LIFE_INTERACTIVE_LOGIN_AGENT_IDS: "${NATIONAL_LIFE_INTERACTIVE_LOGIN_AGENT_IDS:-}"
      NATIONAL_LIFE_INTERACTIVE_LOGIN_ALL_AGENTS: "${NATIONAL_LIFE_INTERACTIVE_LOGIN_ALL_AGENTS:-false}"
      # Makes each keep-alive tick also cross /agent/sso/foresight, so the
      # carrier's Auth0 session is touched alongside the portal one. Measured
      # 2026-07-31: the portal touch renews no Auth0 cookie at all, and the
      # downstream SSO was dead twelve hours after login while `/agent/` was
      # still authenticated. Only useful from the start of a session's life —
      # it renews, it does not resurrect.
      NATIONAL_LIFE_KEEP_ALIVE_SSO_JUMP: "${NATIONAL_LIFE_KEEP_ALIVE_SSO_JUMP:-false}"
    mem_limit: 768m
    # Counts threads, not processes. The worker alone sits at ~72 of them, and
    # each `docker exec ... tsx` adds roughly 25 more, so at 128 a second
    # concurrent script exhausted the container: `sh: can't fork`, and Prisma
    # died with "PANIC: timer has gone away" — which reads like a database fault
    # and is not one. Raised so an operator can run a probe while a sync runs.
    pids_limit: 512
    networks:
      coolify:
        aliases:
          - national-life-runtime
      national-life-private: {}
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.middlewares.keeprone-nlgviewer-https.redirectscheme.scheme=https
      - traefik.http.routers.keeprone-nlgviewer-http.entrypoints=http
      - traefik.http.routers.keeprone-nlgviewer-http.middlewares=keeprone-nlgviewer-https
      - traefik.http.routers.keeprone-nlgviewer-http.rule=Host(`national-life-viewer.keeprone.com`)
      - traefik.http.routers.keeprone-nlgviewer-http.service=keeprone-nlgviewer
      - traefik.http.routers.keeprone-nlgviewer-https.entrypoints=https
      - traefik.http.routers.keeprone-nlgviewer-https.rule=Host(`national-life-viewer.keeprone.com`)
      - traefik.http.routers.keeprone-nlgviewer-https.service=keeprone-nlgviewer
      - traefik.http.routers.keeprone-nlgviewer-https.tls=true
      - traefik.http.routers.keeprone-nlgviewer-https.tls.certresolver=letsencrypt
      - traefik.http.services.keeprone-nlgviewer.loadbalancer.server.port=3010

networks:
  coolify:
    external: true
    name: coolify
  # Steel can reach the carrier through this bridge, but it is not attached to
  # Coolify's shared application network. Only the broker joins both networks.
  national-life-private:
    name: keeprone-national-life-private
