services:
  kbot-credential-broker:
    build:
      context: ..
      dockerfile: Dockerfile.kbot-credential-broker
    restart: unless-stopped
    user: "10001:10001"
    expose:
      - "3020"
    environment:
      NODE_ENV: production
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
      REDIS_URL: "${REDIS_URL:?REDIS_URL is required}"
      KBOT_CREDENTIAL_BROKER_ENABLED: "${KBOT_CREDENTIAL_BROKER_ENABLED:-false}"
      KBOT_CREDENTIAL_AUTO_LOGIN_AGENT_IDS: "${KBOT_CREDENTIAL_AUTO_LOGIN_AGENT_IDS:-}"
      KBOT_CREDENTIAL_AUTO_LOGIN_ALL_AGENTS: "${KBOT_CREDENTIAL_AUTO_LOGIN_ALL_AGENTS:-false}"
      KBOT_CREDENTIAL_VAULT_ADDR: "${KBOT_CREDENTIAL_VAULT_ADDR:?Vault address is required}"
      KBOT_CREDENTIAL_VAULT_MOUNT: "${KBOT_CREDENTIAL_VAULT_MOUNT:-transit}"
      KBOT_CREDENTIAL_VAULT_KEY: "${KBOT_CREDENTIAL_VAULT_KEY:-kbot-national-life}"
      KBOT_CREDENTIAL_VAULT_DECRYPT_TOKEN_FILE: /run/secrets/vault-token
      KBOT_CREDENTIAL_BROKER_PORT: "3020"
      NODE_EXTRA_CA_CERTS: /run/secrets/vault-ca.crt
    volumes:
      - "${KBOT_CREDENTIAL_VAULT_DECRYPT_TOKEN_HOST_FILE:?Vault token sink is required}:/run/secrets/vault-token:ro"
      - "${KBOT_CREDENTIAL_VAULT_CA_HOST_FILE:?Vault CA certificate is required}:/run/secrets/vault-ca.crt:ro"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3020/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - coolify

networks:
  coolify:
    external: true
