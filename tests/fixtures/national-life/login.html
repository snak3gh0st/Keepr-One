<!doctype html>
<html lang="en">
  <body>
    <main data-carrier-id="NATIONAL_LIFE" data-portal-page="login">
      <h1>National Life Producer Center</h1>
      <form action="/session/login" method="post">
        <label for="producer-number">Producer Number</label>
        <input id="producer-number" name="username" type="text" autocomplete="username" />

        <label for="producer-password">Password</label>
        <input id="producer-password" name="password" type="password" autocomplete="current-password" />

        <button type="submit">Sign in</button>
      </form>
    </main>
  </body>
</html>
